function seek(n){index=Math.max(0,Math.min(REPORT.frames.length-1,n));render();}
function render(){const frame=REPORT.frames[index],prev=index?REPORT.frames[index-1]:null;$('timeline').value=index;$('counter').textContent=`${index+1} / ${REPORT.frames.length}`;$('prev').disabled=$('first').disabled=index===0;$('next').disabled=$('last').disabled=index===REPORT.frames.length-1;
 document.querySelector('.line.active')?.classList.remove('active');const active=frame.line?$('line-'+frame.line):null;if(active){active.classList.add('active');const box=$('code');const y=active.getBoundingClientRect().top-box.getBoundingClientRect().top+box.scrollTop;if(y<box.scrollTop||y>box.scrollTop+box.clientHeight-35)box.scrollTo({top:Math.max(0,y-box.clientHeight/2),behavior:'instant'});}
 $('lineInfo').textContent=frame.line?`第 ${frame.line} 行${frame.event==='before'?' · 执行前':frame.event==='return'?' · 返回时':frame.event==='exception'?' · 异常时':''}`:'状态';$('panels').replaceChildren();
 for(const panel of frame.panels||[]){let content;const previous=prev?.panels?.find(p=>p.key===panel.key);if(panel.kind==='LogTracer'){content=element('pre','log',String(panel.data));}else{content=element('div');const table=element('table','matrix');const rows=panel.kind==='Array2DTracer'?panel.data:[panel.data];if(Array.isArray(rows)){const heading=element('tr');heading.append(element('th','',panel.kind==='Array2DTracer'?'行 / 列':'下标'));for(let c=0;c<Math.max(0,...rows.map(r=>Array.isArray(r)?r.length:0));c++)heading.append(element('th','',c));table.append(heading);rows.forEach((row,r)=>{const tr=element('tr');tr.append(element('th','',panel.kind==='Array2DTracer'?'P'+r:''));if(Array.isArray(row))row.forEach((v,c)=>{const key=panel.kind==='Array2DTracer'?r+':'+c:String(c);let cls='cell';if(panel.selected.includes(key))cls+=' selected';if(panel.patched.includes(key))cls+=' patched';const old=panel.kind==='Array2DTracer'?previous?.data?.[r]?.[c]:previous?.data?.[c];if(previous&&JSON.stringify(old)!==JSON.stringify(v))cls+=' changed';tr.append(element('td',cls,typeof v==='object'?JSON.stringify(v):String(v)));});table.append(tr);});}content.append(table);if(panel.kind==='ChartTracer'&&Array.isArray(panel.data)){const bars=element('div','bars');const max=Math.max(1,...panel.data.filter(v=>typeof v==='number').map(Math.abs));panel.data.forEach(v=>{const b=element('div','bar',v);b.style.height=Math.max(10,Math.abs(Number(v))/max*100)+'px';bars.append(b);});content.append(bars);}}$('panels').append(card(panel.title,content));}
 if(frame.variables){const table=element('table','variables');for(const [key,value] of Object.entries(frame.variables)){const tr=element('tr');tr.append(element('td','',key));const td=element('td');td.append(element('pre','',JSON.stringify(value,null,2)));tr.append(td);table.append(tr);}$('panels').append(card('局部变量 · '+(frame.function||'main'),table));}
 if(!$('panels').children.length)$('panels').append(element('div','card empty','这一刻尚未产生可展示的状态。'));if(index===REPORT.frames.length-1)pause();
}
function toggle(){if(timer){pause();return;}if(index===REPORT.frames.length-1)seek(0);$('play').textContent='Ⅱ 暂停';timer=setInterval(()=>seek(index+1),Number($('speed').value));}
$('play').onclick=toggle;$('prev').onclick=()=>{pause();seek(index-1)};$('next').onclick=()=>{pause();seek(index+1)};$('first').onclick=()=>{pause();seek(0)};$('last').onclick=()=>{pause();seek(REPORT.frames.length-1)};$('timeline').oninput=e=>{pause();seek(Number(e.target.value))};$('speed').onchange=()=>{if(timer){pause();toggle()}};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle();}else if(e.key==='ArrowLeft'){e.preventDefault();pause();seek(index-1)}else if(e.key==='ArrowRight'){e.preventDefault();pause();seek(index+1)}else if(e.key==='Home'){pause();seek(0)}else if(e.key==='End'){pause();seek(REPORT.frames.length-1)}});render();
</script></body></html>
