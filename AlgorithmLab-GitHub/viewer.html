<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algorithm Lab · 代码实验室</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#e8edf5;background:#0b111d;color-scheme:dark;--accent:#67e8c0;--muted:#96a4b9;--edge:#293346}*{box-sizing:border-box}body{margin:0}header{padding:25px 32px 18px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;gap:20px}h1{font-size:23px;letter-spacing:-.5px;margin:4px 0 7px}header small{color:var(--accent);letter-spacing:2px}p{margin:5px 0;color:var(--muted);font-size:13px}.tag{font-size:12px;color:var(--accent);border:1px solid #2c5b50;background:#142d29;border-radius:6px;padding:8px 12px;align-self:center}nav{position:sticky;top:0;z-index:2;background:#111a29;padding:14px 32px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--edge);flex-wrap:wrap}button,select{font:inherit;border:1px solid #364156;background:#1c293d;color:#e8edf5;border-radius:6px;padding:8px 13px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}#play{background:var(--accent);color:#10241f;border-color:var(--accent);min-width:86px;font-weight:600}#timeline{flex:1;min-width:100px;accent-color:var(--accent)}#counter{font:13px Consolas,monospace;min-width:95px}label{font-size:12px;color:var(--muted)}main{padding:22px 32px;display:grid;grid-template-columns:minmax(320px,.9fr) minmax(400px,1.15fr);gap:22px;align-items:start}main>section{min-width:0}.card{background:#121c2c;border:1px solid var(--edge);border-radius:10px;overflow:hidden;margin-bottom:16px}.caption{padding:12px 16px;border-bottom:1px solid var(--edge);font-size:13px;display:flex;justify-content:space-between;color:#c7d3e6}.caption span{color:var(--muted);font-size:11px}#code{font:12px/1.9 Consolas,monospace;overflow:auto;max-height:66vh;padding:10px 0;white-space:pre}.line{display:block;padding:0 14px;border-left:3px solid transparent}.ln{display:inline-block;width:36px;color:#66778e;user-select:none}.line.active{background:#1a3a35;border-left-color:var(--accent);color:#d6fff0}.line.active .ln{color:var(--accent)}.body{padding:16px;overflow:auto}.matrix{border-collapse:separate;border-spacing:5px;font:14px Consolas,monospace}.matrix th{font-size:11px;color:#8193ad;font-weight:400;padding:5px}.cell{min-width:43px;text-align:center;padding:10px 9px;background:#202e44;border:1px solid #33445e;border-radius:5px;transition:background .2s,border-color .2s}.cell.selected{background:#533e21;border-color:#e6b35e;color:#ffdfa0}.cell.patched{background:#174c42;border-color:#67e8c0;color:#b4ffe5}.cell.changed{box-shadow:0 0 0 1px #a9bfff inset}.log{white-space:pre-wrap;overflow-wrap:anywhere;color:#c8dded;font:13px/1.8 Consolas,Microsoft YaHei,monospace;max-height:300px;overflow:auto;margin:0}#notice{margin:18px 32px 0;border:1px solid #845f2c;background:#2b241a;padding:14px 18px;border-radius:8px;white-space:pre-wrap;font-size:13px;max-height:250px;overflow:auto}.legend{font-size:12px;color:var(--muted);padding:0 32px 20px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 5px 0 16px}.empty{padding:25px;color:var(--muted)}details{margin:0 32px 24px;border:1px solid var(--edge);border-radius:8px;padding:12px 16px;font-size:13px}summary{cursor:pointer;color:var(--muted)}details pre{max-height:220px;overflow:auto;white-space:pre-wrap}footer{padding:8px 32px 24px;color:#75869d;font-size:12px}.variables{width:100%;border-collapse:collapse;font-size:12px}.variables td{border-bottom:1px solid #243047;padding:9px 6px;vertical-align:top}.variables td:first-child{font-family:Consolas,monospace;color:var(--accent);width:110px}.variables pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.bars{display:flex;gap:8px;height:110px;align-items:end}.bar{background:#488f88;min-width:24px;text-align:center;border-radius:4px 4px 0 0;font-size:11px;padding-top:4px}.mode-note{padding:0 32px;color:var(--muted);font-size:12px;line-height:1.8}a{color:var(--accent)}@media(max-width:850px){header,nav{padding:15px}main{grid-template-columns:1fr;padding:15px}#code{max-height:40vh}#notice{margin:15px}.tag{display:none}}
</style></head><body>
<header><div><small>ALGORITHM LAB / 本地代码实验室</small><h1 id="title"></h1><p id="subtitle"></p></div><div class="tag">运行一次 · 逐步观察 · 随时回看</div></header>
<nav aria-label="播放控制"><button id="first" title="回到开始 Home">|‹</button><button id="prev" title="上一步 ←">← 上一步</button><button id="play">▶ 播放</button><button id="next" title="下一步 →">下一步 →</button><button id="last" title="跳到最后 End">›|</button><input id="timeline" aria-label="执行步骤" type="range" min="0" value="0"><span id="counter"></span><label>每步 <select id="speed"><option value="1200">1.2 秒</option><option value="650" selected>0.65 秒</option><option value="250">0.25 秒</option></select></label></nav>
<div id="notice" hidden></div><p class="mode-note" id="modeNote"></p>
<main><section><div class="card"><div class="caption">源代码 <span id="lineInfo"></span></div><div id="code"></div></div><p>快捷键：空格播放 / 暂停，← → 单步，Home / End 跳转。</p></section><section id="panels" aria-live="polite"></section></main>
<div class="legend">标记 <i class="dot" style="background:#e6b35e"></i>正在检查 <i class="dot" style="background:#67e8c0"></i>代码主动标记的更新 <i class="dot" style="background:#a9bfff"></i>与前一步相比数值变化</div>
<details><summary>运行输出与记录说明</summary><pre id="stdout"></pre><p id="filePath"></p><p>这是一次实际执行完成后的记录回放。退回只改变画面，不撤销程序对文件等外部状态的操作。修改源文件后，请从编辑器重新运行可视化。</p></details>
<footer>本地生成，无在线编译服务。数组与日志动画使用本项目的状态快照和记录接口。第一版尚未包含图与树的专用渲染。</footer>
<script>
const REPORT = /*__REPORT_DATA__*/;
const $=id=>document.getElementById(id);let index=0,timer=null;
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function card(title,content){const box=element('div','card');box.append(element('div','caption',title));const body=element('div','body');body.append(content);box.append(body);return box;}
$('title').textContent=REPORT.name;$('subtitle').textContent=REPORT.mode||'执行诊断';$('timeline').max=REPORT.frames.length-1;
$('stdout').textContent=REPORT.stdout||'没有标准输出。';$('filePath').textContent=REPORT.path;
const notes=[REPORT.error,...REPORT.warnings.map(w=>'提示：'+w)].filter(Boolean);if(notes.length){$('notice').hidden=false;$('notice').textContent=notes.join('\n');}
$('modeNote').textContent=REPORT.mode.includes('逐行')?'逐行模式：高亮表示即将执行的行；右侧是执行该行前的局部变量。列表与深层对象会截断。':'动画模式：高亮行对应记录接口标出的步骤；画面反映该步骤之前发出的可视化命令。';
REPORT.source.split('\n').forEach((text,i)=>{const row=element('span','line');row.id='line-'+(i+1);row.append(element('span','ln',i+1),document.createTextNode(text||' '));$('code').append(row);});
function pause(){if(timer)clearInterval(timer);timer=null;$('play').textContent='▶ 播放';}
function seek(n){index=Math.max(0,Math.min(REPORT.frames.length-1,n));render();}
function render(){const frame=REPORT.frames[index],prev=index?REPORT.frames[index-1]:null;$('timeline').value=index;$('counter').textContent=`${index+1} / ${REPORT.frames.length}`;$('prev').disabled=$('first').disabled=index===0;$('next').disabled=$('last').disabled=index===REPORT.frames.length-1;
 document.querySelector('.line.active')?.classList.remove('active');const active=frame.line?$('line-'+frame.line):null;if(active){active.classList.add('active');const box=$('code');const y=active.getBoundingClientRect().top-box.getBoundingClientRect().top+box.scrollTop;if(y<box.scrollTop||y>box.scrollTop+box.clientHeight-35)box.scrollTo({top:Math.max(0,y-box.clientHeight/2),behavior:'instant'});}
 $('lineInfo').textContent=frame.line?`第 ${frame.line} 行${frame.event==='before'?' · 执行前':frame.event==='return'?' · 返回时':frame.event==='exception'?' · 异常时':''}`:'状态';$('panels').replaceChildren();
 for(const panel of frame.panels||[]){let content;const previous=prev?.panels?.find(p=>p.key===panel.key);if(panel.kind==='LogTracer'){content=element('pre','log',String(panel.data));}else{content=element('div');const table=element('table','matrix');const rows=panel.kind==='Array2DTracer'?panel.data:[panel.data];if(Array.isArray(rows)){const heading=element('tr');heading.append(element('th','',panel.kind==='Array2DTracer'?'行 / 列':'下标'));for(let c=0;c<Math.max(0,...rows.map(r=>Array.isArray(r)?r.length:0));c++)heading.append(element('th','',c));table.append(heading);rows.forEach((row,r)=>{const tr=element('tr');tr.append(element('th','',panel.kind==='Array2DTracer'?'P'+r:''));if(Array.isArray(row))row.forEach((v,c)=>{const key=panel.kind==='Array2DTracer'?r+':'+c:String(c);let cls='cell';if(panel.selected.includes(key))cls+=' selected';if(panel.patched.includes(key))cls+=' patched';const old=panel.kind==='Array2DTracer'?previous?.data?.[r]?.[c]:previous?.data?.[c];if(previous&&JSON.stringify(old)!==JSON.stringify(v))cls+=' changed';tr.append(element('td',cls,typeof v==='object'?JSON.stringify(v):String(v)));});table.append(tr);});}content.append(table);if(panel.kind==='ChartTracer'&&Array.isArray(panel.data)){const bars=element('div','bars');const max=Math.max(1,...panel.data.filter(v=>typeof v==='number').map(Math.abs));panel.data.forEach(v=>{const b=element('div','bar',v);b.style.height=Math.max(10,Math.abs(Number(v))/max*100)+'px';bars.append(b);});content.append(bars);}}$('panels').append(card(panel.title,content));}
 if(frame.variables){const table=element('table','variables');for(const [key,value] of Object.entries(frame.variables)){const tr=element('tr');tr.append(element('td','',key));const td=element('td');td.append(element('pre','',JSON.stringify(value,null,2)));tr.append(td);table.append(tr);}$('panels').append(card('局部变量 · '+(frame.function||'main'),table));}
 if(!$('panels').children.length)$('panels').append(element('div','card empty','这一刻尚未产生可展示的状态。'));if(index===REPORT.frames.length-1)pause();
}
function toggle(){if(timer){pause();return;}if(index===REPORT.frames.length-1)seek(0);$('play').textContent='Ⅱ 暂停';timer=setInterval(()=>seek(index+1),Number($('speed').value));}
$('play').onclick=toggle;$('prev').onclick=()=>{pause();seek(index-1)};$('next').onclick=()=>{pause();seek(index+1)};$('first').onclick=()=>{pause();seek(0)};$('last').onclick=()=>{pause();seek(REPORT.frames.length-1)};$('timeline').oninput=e=>{pause();seek(Number(e.target.value))};$('speed').onchange=()=>{if(timer){pause();toggle()}};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle();}else if(e.key==='ArrowLeft'){e.preventDefault();pause();seek(index-1)}else if(e.key==='ArrowRight'){e.preventDefault();pause();seek(index+1)}else if(e.key==='Home'){pause();seek(0)}else if(e.key==='End'){pause();seek(REPORT.frames.length-1)}});render();
</script></body></html>
